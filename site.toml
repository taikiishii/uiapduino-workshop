# =========================================================================
# site.toml  --  この教材だけのちがいを集めた設定
#
# 共通のしくみ（build の手順・CSS・JS・テンプレート）は workshop-kit 側にある。
# ここに無いものを変えたくなったら、kit を直す＝ぜんぶの教材に効く、と考える。
# =========================================================================

[site]
name         = "UIAPduino 体験ワークショップ"
header       = "UIAPduino 体験ワークショップ"
logo         = "board.png"                # 見出しの頭に出すボードの絵（assets/board.png）
base_url     = "https://taikiishii.github.io/uiapduino-workshop/"
title_suffix = " — UIAPduino ワークショップ"

# Arduino IDE 2 の画面の色にそろえる（2026-10-11。IDE のスクリーンショットから色を取った）
#   #008184 … ボタンの字・タブの下線 ／ #006d70 … 上と下の帯 ／ #005b5e … 進行バー
accent        = "#008184"
accent_dark   = "#006d70"
accent_bright = "#008184"   # もくじの帯は #008184 → #006d70

# ---- もくじカードの枠色 ---------------------------------------------------
# frontmatter の color: がこのキーを引く。c1〜c5 をぐるぐる使う。
[palette]
# カードの枠は、編の中で c1 から順にカラフルに（micro:bit 版と同じ考え方・2026-10-11）
c1 = "#ffb3c1"   # ピンク
c2 = "#ffd98a"   # 黄
c3 = "#a7e3a7"   # 緑
c4 = "#9fd8f0"   # 青
c5 = "#f0e08a"   # からし色
c6 = "#ffc2a8"   # サーモン
c7 = "#c9b3e8"   # 紫

# ---- 飾りの色（Arduino IDE 2 の雰囲気にそろえる）----------------------------
[theme]
bg         = "#f7f9f9"                                   # IDE のサイドバー
bg_dots    = ["rgba(0,129,132,.07)", "rgba(0,109,112,.05)"]
rainbow    = ["#005b5e", "#006d70", "#008184", "#62b6b7", "#7fcbcd"]
slide_frames = ["#7fcbcd", "#9ad1c2", "#62b6b7", "#a9c9dc", "#b8d8d9"]   # カードの枠と同じ5色
cover_glow = ["#e9f2f2", "#ecf1f1"]                      # IDE のボタンの地・左の帯
hint_bg    = "#e9f2f2"
qr_frame   = "#7fcbcd"
qr_dark    = "#005b5e"                                   # 白地で読める濃さ

# ---- もくじのセクション ---------------------------------------------------
# 並べた順に表示される。name は frontmatter の section: と一致させる。
# 章フォルダ名の頭： i=導入編 / b=基本編 / c=制御編 / e=発展編 / m=拡張編 / p=作品編 / x=付録
[[sections]]
name  = "導入編"
cls   = "s-intro"
title = "🔰 導入編"
sub   = "Arduino と UIAPduino をはじめよう"
line  = ["#7fcbcd", "#62b6b7"]

[[sections]]
name  = "基本編"
cls   = "s-basic"
title = "🔌 基本編"
sub   = "LED・スイッチ・つまみ　＜ここまでで半日コース＞"
line  = ["#62b6b7", "#008184"]

[[sections]]
name  = "制御編"
cls   = "s-ctrl"
title = "🔁 制御編"
sub   = "くりかえしと条件でプログラムを組み立てる　＜ここまでで1日コース＞"
line  = ["#008184", "#006d70"]

[[sections]]
name  = "発展編"
cls   = "s-adv"
title = "🚀 発展編"
sub   = "センサーで感じて、モーターで動かす"
line  = ["#006d70", "#005b5e"]

[[sections]]
name  = "拡張編"
cls   = "s-ext"
title = "🧩 拡張編"
sub   = "ライブラリを使って、部品をふやす"
line  = ["#005b5e", "#008184"]

[[sections]]
name  = "作品編"
cls   = "s-project"
title = "🛠 作品編"
sub   = "自分だけの作品を、構想から発表まで　＜複数日コース＞"
line  = ["#008184", "#7fcbcd"]

[[sections]]
name  = "付録"
cls   = "s-appendix"
title = "📎 付録"
sub   = "部品・ピン配置・こまったとき・はんだ付け"
line  = ["#cfd8dc", "#b0bec5"]

# ---- コードの色分け -------------------------------------------------------
# Arduino でよく出てくる関数・型。コードの中で青く表示される。
[code]
namespaces = [
  "pinMode", "digitalWrite", "digitalRead",
  "analogRead", "analogWrite",
  "analogReadResolution", "analogWriteResolution", "analogWriteFrequency",
  "delay", "delayMicroseconds", "millis", "micros",
  "tone", "noTone", "pulseIn",
  "map", "constrain", "random",
  "setup", "loop",
  "Serial", "Wire", "SPI", "EEPROM", "Servo",
]

# ---- 博士の吹き出し -------------------------------------------------------
[mascot]
auto     = true   # 60文字未満の短い吹き出しは顔だけのアイコンにする
full_min = 60     # >> ／ >| で個別に上書きできる

[license]
copyright = "Copyright © 2026 Taiki Ishii"
