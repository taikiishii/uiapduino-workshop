# ② 温度をはかろう

気温を数字にする

*UIAPduino 体験ワークショップ*

---

# なにをするの？

:::

こんどは**温度**をはかってみるよ。

- 温度センサーは、温度に応じて**電圧が変わる**部品
- `analogRead` で読んで、**計算で温度に直す**
- 暑くなったら知らせる

> センサーの値をそのまま使うのではなく、**意味のある数**に直すのがこの章のポイント。

:::

> 📷 温度センサーをつないだ写真と、手で握って反応しているようす

---

# 温度センサーのしくみ
使うのは **MCP9700** というアナログ式のセンサー。足は3本だよ。

- 温度が上がると、出てくる**電圧が高くなる**
- 0℃のとき **0.5V**、1℃上がるごとに **10mV** ずつ

> ⚠ **平らな面を手前**にして、左から **VDD・出力・GND**。
> 逆につなぐと熱くなるので、必ず確かめてから電源を入れよう。

---

# つなごう

:::

**USBケーブルを抜いてから**つなごう。

1. **VDD**（左）を **5V** につなぐ
2. **出力**（まん中）を **A2** につなぐ
3. **GND**（右）を **GND** につなぐ

> ⚠ 向きをまちがえると、センサーが**熱くなる**。
> つないだら、まず指でさわって熱くないか確かめてね。

:::

![平らな面を手前にして、左から VDD・OUT・GND](image/index/bb_temp.png)

---

# 数を温度に直す

:::

読んだ値（0〜1023）から温度を求めるよ。

1. 読んだ値を**電圧**に直す
2. **0.5V** を引く（0℃のときの電圧）
3. **100倍**すると℃になる

> `5.0` はボードの動作電圧。3.3V動作に変えている人は `3.3` にしてね。

:::

```cpp 温度をもとめる
float ondo() {
  int v = analogRead(SENSOR);
  float volt = v * 5.0 / 1024;   // 電圧に直す
  return (volt - 0.5) * 100;     // ℃ に直す
}
```

---

# ⚠ 合っているか確かめよう

:::

計算した温度が正しいか、**たしかめる方法**が大事だよ。

1. 部屋の温度計と見くらべる
2. **手で握る**と温度が上がるはず
3. ずれていたら `0.5` を少し調整する

> 実物と見くらべて合わせることを**校正**というよ。

:::

> 📷 部屋の温度計とならべて見くらべている写真

---

# 暑くなったら知らせよう

:::

温度がしきい値をこえたら、LEDで知らせるよ。

1. 右のプログラムを書きこむ
2. センサーを手で握ってあたためる
3. 28℃をこえるとLEDが光る

> 数字が見えないので、**しきい値をこえたかどうか**をLEDで表す。
> これがこのボードでの「数を見る」方法だったね。

:::

```cpp `e2_temp` 28℃をこえたら光る
const int SENSOR = A2;
const int LED    = 5;

void setup() {
  pinMode(LED, OUTPUT);
}

void loop() {
  int v = analogRead(SENSOR);
  float volt = v * 5.0 / 1024;
  float t = (volt - 0.5) * 100;
  digitalWrite(LED, t > 28 ? HIGH : LOW);
  delay(200);
}
```

---

# 💪 やってみよう

温度を使って、いろいろな知らせ方を試そう。

1. しきい値を **25℃・30℃** に変えて、反応を見る
2. 温度が高いほど**明るく**光るようにする
3. 暑くなったら**音**でも知らせる（b5 のブザー）

> 💪 温度によって**光の色を変える**ような表現もできるよ
> （LEDを2つ使って、青と赤を切りかえる）。

> 💪 光センサー（e1）と組み合わせて、
> 「暗くて暑いときだけ知らせる」もできるね。
