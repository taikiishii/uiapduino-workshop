# ① 文字を表示しよう

LCD に文字と数を出す

*UIAPduino 体験ワークショップ*

---

# なにをするの？

:::

**LCD**（液晶の画面）に、文字や数を出してみるよ。

- **16文字×2行** の小さな画面
- 線は **4本** だけでつながる
- はじめて**ライブラリ**を使う

> このボードは**シリアルモニタが使えない**ので、数は LED の明るさや点滅で見てきたね。
> LCD なら、**数をそのまま読める**よ。

:::

![LCD 1602。上に16本の端子がならぶ](image/index/lcd_front.jpg)

---

# ライブラリってなに？
ほかの人が作ってくれた、**プログラムの部品**だよ。

- LCD に文字を出すには、細かい合図がたくさん必要
- ライブラリを入れると、`lcd.print("Hello!")` の**1行で書ける**
- 拡張編では、ライブラリを使う部品をあつかう

> ⚠ このボードは**メモリが小さい**（16KB）。LCD のライブラリを入れると、
> それだけで**9割近く**を使うよ。くわしくは付録⑤を見てね。

---

# 4本の線でつながる

:::

裏の小さな基板が、**I2C** という方法で合図を送るよ。

- **GND** … GND
- **VCC** … 5V
- **SDA** … **3番**（データ）
- **SCL** … **4番**（タイミング）

> ⚠ 3番はスイッチ（b2）でも使ったピン。
> いっしょに使うときは、スイッチを**ほかのピン**へ。

:::

![裏。右はしに4本のピン、青いつまみ、左上に「LED」のジャンパー](image/index/lcd_back.jpg)

---

# つなごう

:::

**USBケーブルを抜いてから**つなごう。

1. ボードの **5V** を ＋レール、**GND** を −レールへ
2. LCD の **GND** → −レール ／ **VCC** → ＋レール
3. **SDA** → **3番** ／ **SCL** → **4番**

> LCD の足はオス。**メス−オス**のジャンパーワイヤーを使うよ。
> ⚠ 3番・4番は**下の行**のピン。線は **a・b 行**からさそう。

:::

![表から見ると、上から GND・VCC・SDA・SCL](image/index/bb_lcd.png)

---

# ライブラリを入れよう

:::

Arduino IDE の**ライブラリマネージャ**から入れるよ。

1. 左の**本のマーク**をクリック
2. 「**LiquidCrystal I2C**」で検索
3. 作者に **Frank de Brabander** とあるものを「インストール」

> ⚠ 「互換性がないかもしれません」という**警告**が出るけど、そのまま書きこめるよ。

:::

![本のマークを押して検索。LiquidCrystal_I2C を入れる](image/index/lib_manager.png)

---

# 文字を出そう

:::

1. 右のプログラムを書きこむ
2. 1行目に **Hello!** が出る
3. `"Hello!"` を変えて、好きな文字を出す

> 出せるのは**英数字と記号**。ひらがな・漢字は出ないよ。
> ⚠ `0x3F` は LCD の**アドレス**（住所）。出ないときは `0x27` にしてみよう。

:::

```cpp `m1_hello` 文字を出す
#include <Wire.h>
#include <LiquidCrystal_I2C.h>

LiquidCrystal_I2C lcd(0x3F, 16, 2);  // アドレス・16文字・2行

void setup() {
  lcd.init();           // LCD を使いはじめる
  lcd.backlight();      // 明かりをつける
  lcd.setCursor(0, 0);  // 0文字目・0行目から
  lcd.print("Hello!");
}

void loop() {
}
```

---

# ⚠ 文字が見えないとき

- **光っているのに文字が出ない** → 裏の**青いつまみ**を小さなドライバーで回す（文字の濃さ）
- **光らない** → 裏の「**LED**」の黒いジャンパーがささっているか見る
- **まったく反応しない** → 4本の線と、アドレス（`0x3F`／`0x27`）を確かめる

> いちばん多いのは**青いつまみ**。買ったままだと、文字がうすくて見えないことがよくあるよ。

---

# 数を出そう

:::

LCD なら、**数をそのまま**表示できる。

1. 右のプログラムを書きこむ
2. 2行目の数が **1秒ごとに1ずつ**増える
3. `delay` を変えて、増える速さを変える

> `lcd.print` に変数を入れると、その**数**を出してくれるよ（c1 の変数）。

:::

```cpp `m1_count` 数をかぞえる
#include <Wire.h>
#include <LiquidCrystal_I2C.h>

LiquidCrystal_I2C lcd(0x3F, 16, 2);
int n = 0;

void setup() {
  lcd.init();
  lcd.backlight();
  lcd.print("count");
}

void loop() {
  lcd.setCursor(0, 1);  // 2行目の先頭へ
  lcd.print(n);
  n = n + 1;
  delay(1000);
}
```

---

# つまみの値を見よう

:::

LCD はそのままで、**つまみ**を足すよ。

1. つまみの左はしを **＋レール**、右はしを **−レール**へ
2. まん中を **A2** へ

> これまで LED の明るさで見ていた `analogRead` の値が、**数で読める**よ。

:::

![LCD はそのまま。つまみ（b4 と同じ形）を足す](image/index/bb_lcd_vr.png)

---

# つまみのプログラム

:::

1. 右のプログラムを書きこむ
2. つまみを回すと、数が **0〜1023** で変わる
3. 数を小さくしても、**うしろの桁が残らない**ことを確かめる

> ⚠ 空白4つの `"    "` は**消しゴム**がわり。これがないと、1023 → 5 にしたとき
> 「5023」と表示されてしまうよ。

:::

```cpp `m1_vr` つまみの値を見る
#include <Wire.h>
#include <LiquidCrystal_I2C.h>

LiquidCrystal_I2C lcd(0x3F, 16, 2);
const int VR = A2;

void setup() {
  lcd.init();
  lcd.backlight();
  lcd.print("A2 =");
}

void loop() {
  lcd.setCursor(0, 1);
  lcd.print(analogRead(VR));
  lcd.print("    ");  // 前の数の のこりを消す
  delay(200);
}
```

---

# ⚠ 小数はメモリを食う

:::

**小数**を LCD に出すと、「入らない」エラーになるよ。

- 小数を出すと、プログラムが **10KB 以上**大きくなる
- 温度を **10倍した整数**で計算すれば、ちゃんと入る

> エラーに `overflowed` と出たら、**メモリが足りない**という意味だよ。

:::

```cpp 温度を整数で出す（10倍して計算）
long mv = analogRead(A2) * 5000L / 1024;
int t10 = (mv - 400) * 100 / 195;  // 温度の10倍
lcd.print(t10 / 10);  // 整数の部分
lcd.print(".");
lcd.print(t10 % 10);  // 小数の1けためだけ
lcd.print(" C   ");
```

---

# 💪 やってみよう

表示できるようになったら、いろいろな数を出してみよう。

1. 自分の名前（ローマ字）を2行で出す
2. つまみの値を `map` で **0〜100** に直して、% で出す
3. 温度センサー（e2）の温度を、前のページのやり方で出す
4. 距離センサー（e3）の距離を **cm** で出す

> 数が見えると、センサーの**校正**（合っているか確かめる）がぐっと楽になるよ。

>| 💪 次の**作品編**では、自分で考えた作品を、思いつきから発表までやりきるよ。
> LCD を作品に入れるのもいいね。
