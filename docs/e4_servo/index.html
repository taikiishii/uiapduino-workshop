# ④ サーボモーターを動かそう

角度を指定して動かす

*UIAPduino 体験ワークショップ*

---

# なにをするの？

:::

ここからは「**動かす**」の番だよ。

- サーボモーターは **角度を指定して**その位置で止まる
- ロボットの腕、しっぽ、ハンドルなどに使える
- ライブラリは**使わない**。しくみがそのままコードになる

> ふつうのモーターはぐるぐる回るだけ。サーボは**止められる**のがちがいだよ。

:::

> 📷 サーボが0度・90度・180度を向いている写真（3枚）

---

# パルスで角度が決まる

:::

サーボは、**信号の長さ**で角度を決めるという、ちょっと変わった部品だよ。

- **20ミリ秒ごと**に、短い信号（パルス）を送る
- パルスが**短い**と 0度、**長い**と 180度
- 1回送っただけでは動かない。**送り続ける**のがコツ

> 信号の長さで伝えるなんて、モールス信号みたいだね。

:::

![パルスが長いほど、大きい角度になる](image/index/servo_pulse.png)

---

# つなごう

:::

サーボの線は3本。**USBを抜いてから**つなごう。

1. **茶**（黒）… **− レール**（電池の − も同じレールへ）
2. **赤** … **電池の ＋**
3. **黄**（橙）… **5番ピン**

> ⚠ 赤をボードの 5V につながない。力の電気は電池から。

> 線の色をまちがえるとサーボが壊れる。メンターと確かめてね。

:::

![力の電気は電池から、合図だけボードから。GND は −レールでつなぐ](image/index/bb_servo.png)

---

# ⚠ 電気をたくさん使う

:::

サーボは、LEDとくらべて**とても多くの電気**を使うよ。

力がかかると **700mA** ほど。`5V` から取れるのは **500mA** くらいまで。

足りないと、動いた瞬間に**ボードが再起動する**。だから電池から取るんだ。

> ⚠ `5V` のヒューズが切れると**基板ごと交換**だよ。

> **GND どうしをつなぐ**のを忘れると動かないよ。

:::

![力の電気は電池から、合図だけボードから。GND はつなぐ](image/index/servo_power.png)

---

# プログラムを書きこもう

:::

まず、**部品のあつかい方**を2つの関数にまとめるよ。

1. `servoPulse()` … パルスを**1回**おくる
2. `muku()` … 50回おくりつづけて、その角度をむく
3. `600` と `2400` で動く範囲が変わる

> `for` で50回くりかえすのは「**1秒間、送り続ける**」ため。

:::

```cpp `e4_servo` サーボを動かす
const int SERVO = 5;

void servoPulse(int us) {        // パルスを1回おくる
  digitalWrite(SERVO, HIGH);
  delayMicroseconds(us);         // 600〜2400 で角度がきまる
  digitalWrite(SERVO, LOW);
  delay(20);                     // 20msごと ＝ 1秒に50回
}

void muku(int kakudo) {          // その角度をむく
  int us = map(kakudo, 0, 180, 600, 2400);
  for (int i = 0; i < 50; i++) servoPulse(us);
}
```

---

# 3つの角度をむかせよう

:::

さっきのプログラムの**つづき**に、`setup()` と `loop()` を書きたそう。

1. 同じファイルの**いちばん下**に書きたす
2. 0度 → 90度 → 180度 とくりかえす
3. `muku(45)` のように、とちゅうの角度も指定できる

> `muku()` を1回よぶと、**1秒間そこを向きつづける**んだ。

:::

```cpp `e4_servo` につづけて書く
void setup() {
  pinMode(SERVO, OUTPUT);
}

void loop() {
  muku(0);      // 0度をむく
  muku(90);     // まんなか
  muku(180);    // 180度
}
```

---

# 自分のサーボに合わせよう

サーボは**個体差が大きい**。同じ数字でも動く範囲がちがうよ。

- 範囲がせまい → `600` を小さく、`2400` を大きく
- 端で「**ジー**」とうなる → 範囲を**せまく**する

> ⚠ うなったまま放っておくとサーボが傷む。すぐ調整しよう。

---

# 💪 やってみよう

角度の指定を工夫してみよう。

1. `muku(45)` や `muku(135)` を試して、とちゅうの角度に止める
2. `for` を使って、0度から180度まで**ゆっくり**動かす
3. b2 のスイッチで、押すたびに角度が変わるようにする

> 💪 e3 の距離センサーと組み合わせて、
> 「**近づくとしっぽがふれる**」しかけを作ってみよう。

> 💪 つまみ（b4）で角度を決められるようにもできるよ。
