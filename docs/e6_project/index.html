# ⑥ オリジナル作品をつくろう

組み合わせて、自分の作品にする

*UIAPduino 体験ワークショップ*

---

# なにをするの？

:::

いよいよ仕上げ。**自分で考えた作品**を作るよ。

- ここまでの部品を**組み合わせる**
- 作りたいものを決めて、順番に組み立てる
- できたら**みんなの前で発表**

> 教わったとおりに作るのは、ここまで。ここからは**自分で考える番**だよ。

:::

> 📷 参加者の作品例（何人かぶん）

---

# 組み合わせの考え方

:::

作品はぜんぶ「**感じる**」と「**動く**」の組み合わせでできているよ。

**感じるもの**

- スイッチ／つまみ／光センサー／温度センサー／距離センサー

**動くもの**

- LED／ブザー／サーボ／モーター

> このどれかとどれかを線でつなぐだけで、作品のアイデアになる。

:::

![どれとどれを組み合わせる？　それがアイデアになる](image/index/sense_act.png)

---

# 作例のヒント

:::

まよったら、この中から選んでもいいよ。

- **自動ライト** … 暗くなったら光る
- **バックセンサー** … 近いほど速く鳴る
- **なつく生きもの** … 近づくと動く
- **暑さ知らせ機** … 暑いと知らせる
- **つまみで動く針** … 回すと角度が変わる

> 💪 新しいアイデアでもOK！ メンターに話してみよう。

:::

> 📷 作例の完成写真（3〜4点）

---

# 作りかたの順番

:::

いきなり全部つなぐと、うまくいかないとき原因が分からなくなるよ。

1. **感じる**ほうだけ作って、値が読めるか確かめる
2. **動く**ほうだけ作って、動くか確かめる
3. **つなげる**（if でつなぐ）
4. しきい値や速さを**調整する**

> ⚠ 一度に全部つながない。**1つずつ確かめる**のが、いちばんの近道だよ。

:::

> 📷 段階を追って組み立てているようす

---

# こまったときは

:::

**どこまで動いているか**を切り分けよう。

- LEDを足して、そこまで来たら光らせる
- センサーの値をLEDの明るさで見る
- 配線を1本ずつ確かめる

> **LEDが目のかわり**。ずっと合言葉だったね。

:::

> 📷 切り分け中のようす

---

# 発表しよう

:::

できあがったら、みんなの前で発表しよう。話すのは3つ。

1. **なにを作ったか**
2. **どうやって動くか**（動かして見せる）
3. **くふうしたところ・むずかしかったところ**

> つまずいたところも堂々と話していい。そこが一番おもしろいから。

:::

> 📷 発表しているようす

---

# これからのこと

:::

このボードは1枚290円。**自分で買って続けられる**よ。

- 部品を増やせば、作れるものも増える
- 困ったら**付録**を見よう（ピン配置・こまったとき・はんだ付け）

> きょう作ったものは**世界にひとつだけの作品**。
> 家でも続きを作ってみよう。おつかれさま！ 🎉

:::

> 📷 全員の作品を並べた集合写真
