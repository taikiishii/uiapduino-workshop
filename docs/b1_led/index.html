# ① ブレッドボードにLEDをつなごう

自分でつないだLEDを光らせる

*UIAPduino 体験ワークショップ*

---

# なにをするの？

:::

前の章では、基板についているLEDを光らせたね。
こんどは**自分でつないだLED**を光らせるよ。

- **ブレッドボード**の使い方をおぼえる
- LEDの**向き**と**抵抗**をおぼえる
- プログラムは**数字を1つ変えるだけ**

> ここができると、つなぐ部品を自由に増やせるようになるよ。

:::

> 📷 ブレッドボードにLEDをつないで光らせた写真

---

# ブレッドボードのしくみ

:::

はんだ付けをしなくても、**さして つなぐ**ことができる板だよ。

- **たて5つの穴**が、中でつながっている
- 横のならびは**つながっていない**
- まん中のみぞをまたぐと**べつのグループ**

> 同じグループの穴なら、どこにさしても同じことだよ。

:::

![たて5つの穴が中でつながっている](image/index/breadboard.png)

---

# LEDには向きがある

:::

LEDは**向きが逆だと光らない**（こわれはしないよ）。

- **長い足** … ＋がわ。ピンにつなぐ
- **短い足** … −がわ。抵抗をとおして GND へ

> ⚠ 足を切ってしまうと見分けられなくなる。
> そのときは**中の大きいほうの金具**が−がわだよ。

:::

> 📷 LEDの長い足・短い足を大きく写した写真（矢印つき）

---

# なぜ抵抗がいるの？

:::

LEDは**電気を流しすぎるとこわれる**。抵抗は「流れる量をおさえる係」だよ。

- 使うのは **330Ω**（オーム）
- 色の帯は **だいだい・だいだい・茶**
- 抵抗に**向きはない**。どちら向きでもOK

> ⚠ 抵抗を入れずにつなぐと、LEDが一瞬で切れてしまうよ。

:::

> 📷 330Ωの抵抗のカラーコードを大きく写した写真

---

# つないでみよう

:::

**USBケーブルを抜いてから**つなごう。

1. LEDをブレッドボードにさす
2. LEDの**短い足**と同じたてならびに、**抵抗**をさす
3. 抵抗のもう一方を **GND** につなぐ
4. LEDの**長い足**を **5番ピン**につなぐ

> ⚠ 配線を変えるときは、かならずUSBを抜いてからにしよう。

:::

> 📷 配線のようすを真上から撮った写真（ピン名を書きこむ）

![5番ピン → LED → 抵抗 → GND の順につなぐ](image/index/wiring_led.png)

---

# プログラムを書きこもう

:::

前の章のプログラムと、ちがうのは**数字1つだけ**。

1. `const int LED = 2;` を **`5`** に変える
2. いつもの手順で書きこむ
3. ブレッドボードのLEDが点滅したら成功！ 🎉

> `2` は基板のLED、`5` はブレッドボードのLED。
> **番号を変えると、光るLEDが変わる**んだ。

:::

```cpp 外づけLEDのLチカ
const int LED = 5;          // ブレッドボードのLED

void setup() {
  pinMode(LED, OUTPUT);
}

void loop() {
  digitalWrite(LED, HIGH);
  delay(500);
  digitalWrite(LED, LOW);
  delay(500);
}
```

---

# 💪 やってみよう

プログラムと配線の両方をさわってみよう。

1. LEDを **7番ピン**につなぎかえて、プログラムも `7` に変える
2. LEDを**2つ**にして、かわりばんこに光らせる（`5` と `7`）
3. 点滅の速さを変えて、2つのLEDのテンポをずらす

> 💪 信号機みたいに、3つのLEDを順番に光らせてみよう（`5` `7` `8`）。

> ⚠ LEDを増やすときは、**1つずつに抵抗**をつけてね。
