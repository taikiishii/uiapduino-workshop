# ③ 材料と道具をあつめよう

早めに そろえる

*UIAPduino 体験ワークショップ*

---

# なにをするの？
設計図ができたら、**足りないもの**を洗い出そう。

- **電子部品** … センサー・モーター・抵抗
- **工作の材料** … 骨組みになるもの
- **道具** … 切る・くっつける・はかる

> ⚠ 通販は**届くまでに日数がかかる**。
> 買うものは、いちばん先に決めよう。

---

# 電子部品
設計図の「つなぎ方」を見ながら、数を数えよう。

- LED … 何個？　**1個につき抵抗1本**（1kΩ）
- センサー … 何を感じたい？
- 動くもの … サーボ？　モーター？
- **電池** … モーターを使うなら わすれずに

> 部品の名前と買う場所は、付録①「部品リスト」にまとめてあるよ。

> ⚠ ジャンパーワイヤーは**多めに**。断線していることがあるんだ。

---

# 工作の材料
骨組みになるものは、家にあるもので足りることが多いよ。

- 紙・ボード … 段ボール・厚紙・スチレンボード・牛乳パック
- プラスチック … ペットボトル・プラ箱・プラバン・卵パック
- 棒・板 … 割りばし・竹串・ストロー・かまぼこの板

> えらび方は、⑤「骨格をつくろう」にまとめてあるよ。

> **すてる前のもの**が、いちばんの材料になることも多いんだ。

---

# 道具
作るときに使う道具だよ。**借りられるもの**は借りよう。

- 切る … はさみ・カッター（**下じきを敷く**）
- くっつける … グルーガン・両面テープ・結束バンド
- はかる … じょうぎ・メジャー

> ⚠ **グルーガンの先は とても熱い。** はんだごてと同じで、
> かならず**大人といっしょ**に使ってね。

> ⚠ カッターは**刃を出しすぎない**。切るときは**手前に引かない**。

---

# ⚠ 買う前に確かめよう
注文する前に、この3つを確かめよう。

1. **電圧は合っている？**（モーターは2〜11V、ボードは5.5Vまで）
2. **ピンは足りている？**（設計図と見くらべる）
3. **届くのは いつ？**（発表の日に間に合う？）

> 1つ注文しわすれると、**そこで作業が止まる**。
> リストに書いて、チェックしながら注文しよう。

---

# 💪 やってみよう

買い物リストを つくろう。

1. 設計図を見ながら、**必要なもの**を全部書き出す
2. **家にあるもの / 買うもの / 借りるもの** に分ける
3. 買うものだけ、**今すぐ**注文する

> 💪 ついでに「**あったら便利なもの**」も書いておこう。
> 予備の部品は、1つこわれたときに作業を止めない。
