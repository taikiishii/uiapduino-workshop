# ② くりかえし（for）

同じ命令を何回もくりかえす

*UIAPduino 体験ワークショップ*

---

# こまったことがある

:::

b3 のさいごに、こんな宿題があったね。

> 数字を少しずつ大きくして、**じわっと明るくなる**ようにしたい。

まじめに書くと、こうなる。

**256行**も書くことになってしまう。

:::
```cpp
analogWrite(LED, 0);
analogWrite(LED, 1);
analogWrite(LED, 2);
...
```
> 📷 長々と続くプログラムのイメージ図

---

# for なら1回書くだけ

:::

`for` は「**これを○回くりかえして**」という命令だよ。

これだけで256回ぶんになる。`v` の中身が **0, 1, 2, … 255** と変わっていくんだ。

> くりかえしの回数をかぞえる箱（変数）を、**カウンタ**とよぶよ。

:::
```cpp
for (int v = 0; v <= 255; v++) {
  analogWrite(LED, v);
}
```
> 📷 v が 0→1→2… と変わるようすを描いた図

---

# Scratch のあのブロックだよ

:::

Scratch を使ったことがあるなら、これを見たことがあるはず。

- **「10回くりかえす」** ＝ `for` のこと
- ブロックの**口にはさむ**部分 ＝ `{ }` の中
- くりかえす回数 ＝ `i < 10` のところ

> 見た目はちがうけど、**やっていることは同じ**。
> Scratch でできたことは、ここでもぜんぶできるよ。

:::

![Scratchの「10回くりかえす」と for は同じこと](image/index/scratch_for.png)

---

# for の3つの部分

:::

かっこの中は、`;` で3つに分かれているよ。

1. `int v = 0` … **はじめ**の値
2. `v <= 255` … **つづける条件**（255以下のあいだ）
3. `v++` … 1回おわるごとに **1ふやす**

> `v++` は「`v = v + 1`」の短い書き方。よく出てくるのでおぼえよう。

:::
```cpp
for (int v = 0; v <= 255; v++)
```
> 📷 3つの部分に色をつけて分けた図

---

# ⚠ < と <= のちがい

:::

2番目に書く条件は、**その数をふくむかどうか**がちがうよ。

- `i < 10` … 10 を**ふくまない** → 0〜9 で **10回**
- `i <= 10` … 10 を**ふくむ** → 0〜10 で **11回**

数えはじめが **0** だから、「◯回くりかえす」は **`< ◯`** になるんだ。

> 明るさの `v <= 255` は、**255 も使いたい**から `<=` なんだ。

:::

![< はその数をふくまない、<= はふくむ](image/index/lt_le.png)

---

# プログラムを書きこもう

:::

じわっと明るくなって、じわっと暗くなるよ。

1. 右のプログラムを書きこむ
2. なめらかに明るく・暗くをくりかえす
3. `delay(5)` を変えると速さが変わる

> `v--` は「1へらす」という意味だよ。

:::

```cpp じわっと明るく、じわっと暗く
const int LED = 5;

void setup() {
  pinMode(LED, OUTPUT);
  analogWriteResolution(8);
}

void loop() {
  for (int v = 0; v <= 255; v++) {    // 明るく
    analogWrite(LED, v);
    delay(5);
  }
  for (int v = 255; v >= 0; v--) {    // 暗く
    analogWrite(LED, v);
    delay(5);
  }
}
```

---

# ⚠ かっこの中はくりかえされる

:::

`{ }` の中だけがくりかえされるよ。外に書くと1回しか実行されない。

- `{ }` の**中** … 256回くりかえす
- `{ }` の**外** … くりかえしが**ぜんぶ終わってから**1回だけ

> ⚠ `for` の行のうしろに `;` を書いてしまうと、
> 中身がくりかえされなくなる。よくあるまちがいだよ。

:::

> 📷 中と外のちがいを色分けした図

---

# 💪 やってみよう

くりかえしの数字を変えてみよう。

1. `v++` を `v = v + 5` にすると、どうなる？
2. `v <= 255` を `v <= 100` にすると、どうなる？
3. 明るくなるのは速く、暗くなるのはゆっくり、にしてみる

> 💪 `for` を使って、ブザーで**音がだんだん高くなる**ようにしてみよう
> （`tone(BUZZER, v)` の `v` を200から800まで変える）。

> 💪 3つのLEDを `for` で順番に光らせたい……
> それには「まとめて置く箱」が必要。`c4` でやるよ。
