# ② くりかえし（for）

同じ命令を何回もくりかえす

*UIAPduino 体験ワークショップ*

---

# なにをするの？

:::

- 明るさを 0 から 255 まで変えるのに、**命令を256回書くのは大変**
- `for` を使うと **1回書くだけ**でくりかえせる
- くりかえしの回数をかぞえる変数のことを**カウンタ**というよ

:::

> 📷 ここに写真やスクリーンショットを貼る（VS Code で画像を貼り付けると image/index/ に保存されます）

---

# プログラム

:::

1. Arduino IDE に下のプログラムを入力する
2. **RESETを押しながら**USBを挿して、書き込む
3. 書き込めたら **RESETをもう1回押す**

> 💪 数字を変えると、どう変わるかためしてみよう。

:::

```cpp だんだん明るく・だんだん暗く
const int LED = 5;

void setup() {
  pinMode(LED, OUTPUT);
  analogWriteResolution(8);
}

void loop() {
  for (int v = 0; v <= 255; v++) {   // だんだん明るく
    analogWrite(LED, v);
    delay(5);
  }
  for (int v = 255; v >= 0; v--) {   // だんだん暗く
    analogWrite(LED, v);
    delay(5);
  }
}
```
