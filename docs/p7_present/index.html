# ⑦ 発表しよう

つくったものを 見せる

*UIAPduino 体験ワークショップ*

---

# 話すのは3つだけ
むずかしく考えなくていい。この3つを話せば じゅうぶんだよ。

1. **なにを作ったか** … 1文で言えるようにしたよね（①）
2. **どうやって動くか** … **動かして見せる**のがいちばん
3. **くふうと 苦労** … ここがいちばん おもしろい

> 3つで1〜2分。みじかくていいんだ。

---

# 動かして見せる
ことばで説明するより、**目の前で動かす**ほうが伝わるよ。

- 電源を入れて、**実際に動かす**
- センサーなら、**手をかざして**みせる
- 動かなかったら、あわてず「いまは動かないけど」と話せばいい

> ⚠ 発表の前に、**電池の残り**を確かめておこう。
> いちばん多い失敗は「本番で電池が切れていた」なんだ。

---

# 苦労したところを話そう
**うまくいった話より、つまずいた話のほうが おもしろい。**

- どこで こまったか
- どうやって 気づいたか
- なにを変えたら 動いたか

> 「最初は本体のほうが回っちゃって…」
> こういう話は、聞いている人の役にも立つんだ。

> 直した道すじを話せる人は、**次も直せる人**だよ。

---

# 人の発表を 聞くとき
見るだけじゃなく、**見つける**つもりで聞こう。

- **まねしたいところ**を1つ見つける
- **聞きたいこと**を1つ考える
- おもしろかったら、そう伝える

> 人の作品からもらったアイデアは、次の自分の作品になる。
> **聞くことも、ものづくりのうち**だよ。

---

# 💪 やってみよう

発表の前に、ひとりで通してみよう。

1. **1文**で言ってみる（なにを作ったか）
2. **動かして**みる（うまくいく？）
3. **苦労したところ**を1つ選んで、話してみる

> 💪 時間をはかってみよう。1〜2分で言えたら じゅうぶん。

> できあがったものは、**世界にひとつだけの作品**。
> 堂々と見せよう。おつかれさま！ 🎉
