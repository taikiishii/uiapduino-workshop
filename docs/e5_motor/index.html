# ⑤ モータードライバでDCモーター

回す・逆に回す・速さを変える

*UIAPduino 体験ワークショップ*

---

# なにをするの？

:::

いよいよ**ぐるぐる回るモーター**を動かすよ。

- なぜ**モータードライバ**が必要なのか
- 正転・逆転・停止のしくみ
- PWM で**スピードを変える**

> ここまでで作った「感じるしかけ」と組み合わせると、**動く作品**になるよ。

:::

> 📷 モーターが回っている写真（正転・逆転）

---

# ⚠ 直接つないではいけない

:::

モーターは、LEDとくらべて**けたちがいに電気を使う**。

- LED … 3ミリアンペアくらい
- モーター … **数百ミリアンペア〜1アンペア**

ピンから直接流せる電気では**まったく足りない**し、
無理に流すと**マイコンがこわれる**。

> だから「**モータードライバ**」という部品にお願いするんだ。

:::

![モーターは LED の100倍以上。ピンから直接ながせる量をはるかにこえる](image/index/current_compare.png)

---

# モータードライバの役目

使うのは **DRV8835** というモータードライバだよ。

- マイコンからの**小さな合図**を受けとる
- **べつの電源**から、モーターに大きな電気を流す
- 合図しだいで、流す**向きも変えられる**

> 「マイコンは指示を出すだけ、力仕事はドライバがやる」という分担だね。

---

# 端子の名前をおぼえよう

![上の行が合図、下の行が力。丸の中はピン番号](image/index/drv8835_pins.png)

---

# つなごう（合図の線）

:::

**USBケーブルを抜いてから**つなごう。まず合図の線から。

1. **VCC** → **＋レール** ／ **MODE** → **＋レール**
2. **APHASE** → **7番**（向きを決める）
3. **AENBL** → **12番**（A3・速さを決める）

> ⚠ VCC は **3V3 ではなく 5V**。MODE も**＋レール**へ。

> 線は**どこからどこへ**が合っていればOK。交差してもいいよ。

:::

![上の行が合図（VCC・MODE・AIN1・AIN2）、下の行が力（VM・AOUT・GND）](image/index/bb_drv8835.png)

---

# つなごう（力の線）

つぎに、モーターと電池をつなぐよ。

1. **AO1・AO2** にモーターの2本の線をつなぐ（向きはどちらでもOK）
2. **VM** に電池の＋をつなぐ（**2〜11V**。単3電池4本＝6Vなど）
3. 電池の−を **GND** につなぐ

> ⚠ 電池の−とボードの GND は、**かならずつなぐ**。
> ここがつながっていないと、合図が伝わらず動かないよ。

---

# 向きと速さを分ける

:::

`MODE` を ＋につないだので、**2本の役わりがきれいに分かれる**よ。

- **`APHASE`** … 向き。`HIGH` で正転、`LOW` で逆転
- **`AENBL`** … 速さ。`0`〜`255`。**0 なら止まる**

> ⚠ 止めるのも **`analogWrite(AENBL, 0)`**。
> `digitalWrite` では PWM が止まらないんだ。

:::

![2本の線の組み合わせで、モーターの動きが決まる](image/index/motor_table.png)

---

# プログラムを書きこもう

:::

正転・逆転・停止をくりかえすよ。

1. 右のプログラムを書きこむ
2. 2秒ずつ、正転 → 逆転 → 停止
3. `200` を **0〜255** で変えると、スピードが変わる

> ⚠ 止めるときも **`analogWrite(..., 0)`** を使う。
> `digitalWrite(LOW)` では PWM が止まらないんだ。

:::

```cpp `e5_motor` 正転と逆転をくりかえす
const int APHASE = 7;   // 向き
const int AENBL  = 12;  // 速さ（PWM）

void setup() {
  pinMode(APHASE, OUTPUT);
  pinMode(AENBL, OUTPUT);
  analogWriteResolution(8);
}

void loop() {
  digitalWrite(APHASE, HIGH); analogWrite(AENBL, 200);  // 正転
  delay(2000);
  digitalWrite(APHASE, LOW);  analogWrite(AENBL, 200);  // 逆転
  delay(2000);
  analogWrite(AENBL, 0);                                // 止まる
  delay(1000);
}
```

---

# モーターを2つにしよう
ロボットカーには**左右2つ**のモーターがいる。**B のがわ**を足すよ。

![モーターBを足す。合図は4本になる](image/index/bb_2motor.png)

---

# Bをつなぐ
A とまったく同じ形。**B** がついた端子を使うだけだよ。

1. **BPHASE** → **9番**（向き）
2. **BENBL** → **6番**（A2・速さ）
3. **BOUT1・BOUT2** に 2つめのモーターをつなぐ

> ＋レール・−レール・電池は**そのまま**。足すのは合図2本とモーター1つ。

> ⚠ はじめから **PHASE/ENABLE** にしておいたから、A の配線を
> 組みかえずに B を足せるんだ。

---

# 左右で動きを変える
2つそろうと、**曲がる**ことができるようになるよ。

- 両方とも正転 … **まっすぐ進む**
- 片方だけ止める … その方向に**曲がる**
- 左右を逆向きに … **その場で回る**
- 片方だけ遅くする … **ゆるく曲がる**

> ⚠ 同じ数にしても、モーターのクセで**まっすぐ進むとはかぎらない**。
> 片方の数を少し変えて、まっすぐになる組み合わせをさがそう。

---

# 2つ動かすプログラム

:::

まっすぐ → 右に曲がる → 止まる、をくりかえすよ。

1. 右のプログラムを書きこむ
2. タイヤをつけて、床で走らせてみる
3. `200` を変えて、速さを調整する

> `susumu(左, 右)` の2つの数も **0〜255**。
> 0 で止まり、255 がいちばん速いよ。

:::

```cpp `e5_car` 2つのモーターで走る
const int APHASE = 7,  AENBL = 12;   // 左
const int BPHASE = 9,  BENBL = 6;    // 右

void setup() {
  pinMode(APHASE, OUTPUT); pinMode(AENBL, OUTPUT);
  pinMode(BPHASE, OUTPUT); pinMode(BENBL, OUTPUT);
  analogWriteResolution(8);
}

void susumu(int a, int b) {          // 左右の速さを決める
  digitalWrite(APHASE, HIGH); analogWrite(AENBL, a);
  digitalWrite(BPHASE, HIGH); analogWrite(BENBL, b);
}

void loop() {
  susumu(200, 200); delay(2000);     // まっすぐ
  susumu(200, 0);   delay(1000);     // 右に曲がる
  susumu(0, 0);     delay(1000);     // 止まる
}
```

---

# 💪 やってみよう

スピードと向きを自由にあやつってみよう。

1. `200` を **80・255** に変えて、速さのちがいを見る
2. `for` を使って、だんだん速く・だんだん遅くする
3. つまみ（b4）でスピードを決める（つまみは **A1**＝0番へ）
4. `susumu()` を使って、**四角に走る**コースを作る

> ⚠ 数字を小さくしすぎると、**うなるだけで回らない**ことがある。
> 回りはじめる最低の数字をさがしてみよう。
