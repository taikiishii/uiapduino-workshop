# ① 部品リストと回路の見方

部品と配線図のよみかた

*UIAPduino 体験ワークショップ*

---

# かならず使うもの
どの章でも使う、基本のセットだよ。

- **UIAPduino Pro Micro CH32V003 V1.4** … 290円
- **USB Type-C ケーブル** … 短めで、データ通信ができるもの
- **ブレッドボード** … はんだ付けなしでつなげる板
- **ジャンパーワイヤー** … オス−オス。20本くらいあると安心

> ⚠ USBケーブルは「充電専用」だと書きこめない。データ通信対応のものを。

---

# 光る・音が出るもの
出力（動かす）がわの部品だよ。

- **LED 赤** … 最初に光らせるのはこれ
- **LED 緑・青** … あとから足していく
- **抵抗 1kΩ** … LED 1個につき1本
- **圧電ブザー（受動型）** … 音の高さを変えられるもの

> ⚠ ブザーには「能動型」もある。そちらは**音の高さが変えられない**ので、
> 買うときは「**受動**」「パッシブ」と書いてあるものを選ぼう。

---

# 用意した LED（3色）
どれも **5mm の高輝度タイプ**（秋月電子）。

- **赤** `OSDR5113A` … 640nm／1200mcd／Vf 2.0V
- **緑（黄緑）** `OSNG5113A` … 570nm／750mcd／Vf 2.0V
- **青** `OSB5DA5A33A-1MA` … 470nm／1120mcd／Vf 2.8V

> `mcd` は**明るさ**、`nm` は**色（波長）**、`Vf` は**光りはじめる電圧**の単位。

> 1kΩ をつけて **2〜3mA** で光らせている。高輝度なので、これで十分明るいよ。

---

# 感じるもの（センサー）
入力がわの部品。作りたいものに合わせて選ぼう。

- **タクトスイッチ** … 押しボタン
- **可変抵抗 10kΩ** … つまみ
- **CdS（光センサー）暗抵抗 1MΩ** ＋ **抵抗 10kΩ**
- **温度センサー MCP9701-E/TO** … ⚠ **9700 とまちがえない**
- **超音波センサー HC-SR04** … グループで共用してもOK

---

# 動かすもの
大きな力を出す部品。**べつの電源**が必要になるよ。

- **サーボモーター**（SG90 など）
- **DCモーター** ＋ **モータードライバ**（DRV8835 モジュール／秋月電子 109848）
- **電池ボックス**（単3×4本＝6V など）… **スイッチつき**が便利

> ⚠ モーターやサーボをUSBだけで動かすと、ボードが再起動することがある。

---

# 抵抗の読み方

:::

抵抗には色の帯がついていて、それが数字を表しているよ。

- **1kΩ** … 茶・黒・赤
- **10kΩ** … 茶・黒・だいだい

> 帯の色の意味：黒0・茶1・赤2・だいだい3・黄4・緑5・青6・むらさき7・灰8・白9

> ⚠ 見分けにくいときは、**テスターで測る**か、袋のままにしておこう。

:::

![ちがうのは3本目だけ。赤なら 1k、だいだいなら 10k](image/index/examples.png)

---

# ブレッドボードの読み方

:::

穴のつながりをおぼえておくのが大事だよ。

- **たて5つの穴**が中でつながっている
- みぞをまたぐと**べつのグループ**
- 横の長い列（＋と−）は**横一列**

> ⚠ 同じたてならびなら、離れて見えてもつながっているよ。

:::

![たて5つの穴が中でつながっている](image/index/breadboard.png)

---

# 配線図の見方
このワークショップ資料では、こんなふうに書くよ。

- **5V ── CdS ── A2 ── 10kΩ ── GND**
- 左から順に、**線でつなぐ順番**を表している
- `──` の間にあるものが、そこに入る部品

> 実物とくらべながら、1つずつ指でたどると分かりやすいよ。

---

# 買うときのめやす
自分で買いそろえるときの参考に。

- ボードとケーブル … 約1,000円
- ブレッドボード・ジャンパーワイヤー・LED・抵抗 … 約1,000円
- センサー類（選んで） … 1つ100〜500円
- サーボ／モーター類 … 1つ400〜800円

> 秋月電子・スイッチサイエンス・マルツなどで買えるよ。
> ボードの買い方は、もくじの下の**参考リンク**を見てね。
