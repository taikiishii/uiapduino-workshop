# ⑩ 実機とコアの落とし穴

公式図どおりに使えない点と、コアの不具合

*この章だけ大人むけ*

---

# この章について
**この章は子ども向けではありません。** 教材を作る人・改造する人むけです。

- 公式ピン配置図に「使える」と書いてあるのに、**実機で使えない**もの
- Arduino 標準の挙動と**ちがう**もの
- すべて **UIAPduino V1.4 ／ ボードパッケージ 1.0.42** での実測

> ⚠ 将来のパッケージ更新で直る可能性がある。**そのときは再検証**すること。

>| 実測の手順とスケッチは、リポジトリの `verify/` にあります。

---

# ⚠ PWM が使えるピンは4本
公式ピン配置図は **0・2・5・6・12** を PWM 可としているが、実機では **0番が動かない**。

- **実際に使えるのは `2` `5` `6` `12` の4本**
- `0`（PA2）・`1`（PA1）・`10`（PD0）は `analogWrite` が**まったく無反応**
- LEDをつないでも点かない。「PWM非対応なら127を境にON/OFF」にもならない

> 原因は **TIM1 の相補出力**（CH1N / CH2N）に割りあてられているため。
> 相補出力はアドバンストタイマの **MOE（主出力イネーブル）ビット**を立てないと
> 端子に出ないが、コアがそこまで設定していない。

>| `digitalWrite` なら 0・1・10 とも**ふつうに使える**。出力として使うぶんには問題ない。

---

# ⚠ `digitalWrite` で PWM が止まらない
`analogWrite` を出したピンに `digitalWrite(pin, LOW)` を呼んでも、**PWM が止まらない**。

- 止めるには **`analogWrite(pin, 0)`** を使う
- `pinMode(pin, OUTPUT)` を呼び直してから `digitalWrite` でも止まる

> ⚠ **標準の Arduino なら止まる。**これはこのコアの不足だよ。

>| 公式 AVR コアの `digitalWrite` には
>| `if (timer != NOT_ON_TIMER) turnOffPWM(timer);` が入っていて、
>| 「PWM対応ピンならデジタル書き込みの前に止める」と明記されている。
>| このコアの `digitalWrite` は `digitalWriteFast` を呼ぶだけで、
>| 相当する処理が存在しない。

---

# ⚠ `pinMode` に出力の種類はない
Arduino の `pinMode` は **`INPUT` / `OUTPUT` / `INPUT_PULLUP`** の3つだけ。

- 「デジタル出力」「アナログ出力」を選ぶ指定は**ない**
- `analogWrite` は内部でタイマーを設定する
- だから**後始末は `digitalWrite` 側の仕事**、というのが Arduino の設計

> 上の不具合は、この「後始末」が抜けていることで起きている。
> 設計を知っておくと、他のボードに移ったときに混乱しない。

---

# ⚠ アナログ入力は5本
公式図は A0〜A6 を示すが、**`A6` は読めない**。

- 使えるのは **`A0` `A1` `A2` `A3` `A5`**
- `analogRead(A6)` は **つねに 0** を返す
- `A7` はそもそも USB の D− なので、直っても使えない

> 原因は `PeripheralPins.c` の `PinMap_ADC` が、ADCチャネル6・7を
> **存在しない `PA_6` / `PA_4`** として登録していること。
> ハードは ADC_IN6 = PD6 のはずなので、**コア側の記述ミス**とみられる。

---

# ⚠ `pulseIn()` が使えない
実装はあるが、**実用にならない**。HC-SR04 の距離測定には使えない。

- **`micros()` の分解能が 1ms しかない**（目盛り自体は正確）
- 1ms 未満のパルスで 0 を返すのは、この分解能で説明がつく
- ⚠ ただし **50ms のパルスでも 0 を返した**。分解能とは別の不具合もある

> 迂回策：`digitalRead()` ＋ `delayMicroseconds()` で**回数を数える**。
> `delayMicroseconds` は SysTick を直接読む別実装なので影響を受けない。

>| 教材の `e3_distance` はこの方式で書いてある。20cm でも反射時間は
>| 約1.16ms なので、`pulseIn` では原理的に足りない。

---

# ⚠ シリアルモニタが使えない
`Serial.print` を前提にした説明は**書けない**。

- 値を見せるには **LEDの明るさ・点滅の速さ・点滅の回数**を使う
- 教材では `analogRead` の値を「100でわった回数だけ点滅」で読ませている

>| デバッグ用の道具は `verify/v12_analogshow/` にある。
>| 任意のアナログピンの値を、基板のLEDで3けた読み取れる。

---

# ⚠ そのほかの注意
数値まわりで、Arduino 標準とちがうところ。

- **`analogWrite` の既定は 0〜4095**（12bit）。`analogWriteResolution(8);` で 0〜255 に
- **`LED_BUILTIN` は未定義**。`const int LED = 2;` と自分で書く
- **`Servo` ライブラリは同梱されていない**。パルスを自作する
- **番号 13・14・17 は欠番**。`11` は SWIO と共用で実質使えない

> 内蔵発振器の精度は **誤差1.7%**（60秒で約59秒）。
> `tone()` の音程ずれは0.3半音程度で、補正なしで使える。

---

# 💪 直っているか確かめる
パッケージを更新したら、この章の内容を**確かめ直そう**。

1. `verify/v04_pwm_scan/` … 0・1・10番の PWM が出るようになったか
2. `verify/v17_pwmoff/` … `digitalWrite` で PWM が止まるようになったか
3. `verify/v05_analog/` … `analogRead(A6)` が値を返すようになったか
4. `verify/v09_pulsein/` … `pulseIn()` が使えるようになったか

>| 直っていたら、この章と `CLAUDE.md` の注意点を更新すること。
>| 教材のコードは迂回策のままでも動くので、あわてて書きかえなくてよい。
