# ① マイコンと UIAPduino ってなに？

290円の小さなコンピュータ

*UIAPduino 体験ワークショップ*

---

# なにをするの？

:::

きょうから、**手のひらにのる小さなコンピュータ**を動かしていくよ。

この章で知ること。

- **どんなもの**なのか
- **どこに使われている**のか
- **どこをさわればいい**のか

> まだプログラムは書かないよ。まずは仲良くなろう。

:::

![これが UIAPduino。指でつまめるくらい小さいよ](image/index/01_inhand.png)

---

# マイコンって、どこにいるの？

:::

**マイコン**は「小さなコンピュータ」。
身のまわりにたくさんいるよ。

- **エアコン** … 温度をはかる
- **電子レンジ** … 時間をはかる
- **自動ドア** … 人を感じる
- **コントローラー** … ボタンを伝える

> どれも「**感じて → 考えて → 動かす**」をしているね。

:::

![どれも中に小さなコンピュータが入っているよ](image/index/08_kaden.png)

---

# パソコンとは、なにがちがうの？

:::

パソコンもコンピュータだけど、ちょっとちがうんだ。

- **画面** … パソコンはある。マイコンは**ない**
- **できること** … マイコンは**ひとつだけ**
- **電源を入れると** … **すぐ動きだす**

> ひとつの仕事をずっとまじめにやり続けるのが得意なんだ。

:::

![ノートパソコンとくらべると、こんなに小さい](image/index/04_vs_pc.png)

---

# Arduino ってなに？

:::

**Arduino** は、マイコンを**だれでも使えるようにしたしくみ**。

1. **ボード** … マイコンがのった基板
2. **Arduino IDE** … プログラムを送る道具

> 世界中で使われているから、**作例がたくさん**ある。
> 困ったときに調べやすいよ。

:::

![これが Arduino IDE。次の章でじゅんびするよ](image/index/07_ide.png)

---

# UIAPduino ってなに？

:::

きょう使う **UIAPduino**。日本の人が作ったボードだよ。

- **1枚 290円**（ジュース2本ぶん！）
- マイコンは **CH32V003**
- 1秒間に **4800万回** きざむ速さで動く
- プログラムは **16KB** まで

> 小さいけど、**LEDやモーターを動かすには十分**なんだ。

:::

![大きさは1円玉とおなじくらい。これで1枚290円！](image/index/05_vs_coin.png)
![左が表（部品がついている面）、右がうら](image/index/02_frontback.png)

---

# 基板を見てみよう

:::

自分のボードを見ながら名前をおぼえよう。

1. **USB Type-C** … パソコンとつなぐ
2. **RESET** … 最初からやり直す
3. **青いLED** … 電気がきているしるし
4. **オレンジのLED** … 自分で光らせる
5. **ピン** … 部品をつなぐところ

> ⚠ 曲げたり、金属の上に置いたりしないでね。

:::

![①USB Type-C ②RESET ③青いLED ④オレンジのLED ⑤ピン](image/index/06_parts.png)

---

# ピンってなに？

:::

**ピン**は外の部品とつなぐ「あな」。ひとつずつ**名前**がある。

- `2` `5` `7` `8` … デジタル（**0か1**）
- `A0` `A1` `A2` … アナログも読める
- `5V` `3V3` `GND` … 電気の＋と−

プログラムでこの名前を書いて指定するんだ。

> ⚠ `11` は**デバッグ用**の信号と同じピン。使わないでおこう。

:::

![UIAPduino のピン配置図（© Yuuki U. / CC BY 4.0）](image/index/pinout.png)

---

# micro:bit とのちがい

:::

micro:bit をさわったことがある人へ。

- **画面・ボタン** … UIAPduino は**ついていない**
- **センサー** … UIAPduino は**自分でつなぐ**
- **プログラム** … UIAPduino は**文字で書く**

> 自分でつなぐ＝**つなぐものを自分で選べる**、ということ。
> 作れるもののはばが、ぐんと広がるんだ。

:::

![左が micro:bit。画面（LED）とボタンが最初からついている。右が UIAPduino](image/index/03_vs_microbit.png)

---

# これから作るもの

このワークショップ資料で、こんなことができるようになるよ。

1. LEDを**光らせる・点滅させる**
2. スイッチを押したら光る、つまみで**明るさを変える**
3. **くりかえし**や**もし〜なら**を使って、自動で動かす
4. **センサー**で明るさや距離を感じとる
5. **モーター**を回して、動く作品にする
6. **自分で考えた作品**を作って、**発表する**

> 💪 まずは次の章で、プログラムを作る道具をじゅんびしよう！
