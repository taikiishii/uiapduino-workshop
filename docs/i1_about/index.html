# ① マイコンと UIAPduino ってなに？

290円の小さなコンピュータ

*UIAPduino 体験ワークショップ*

---

# なにをするの？

:::

きょうから、**手のひらにのる小さなコンピュータ**を自分で動かしていくよ。

この章では、そのコンピュータが

- **どんなもの**なのか
- **どこに使われている**のか
- **どこをさわればいい**のか

を知ろう。まだプログラムは書かないよ。まずは仲良くなろう。

:::

> 📷 UIAPduino を手のひらにのせた写真（大きさが伝わるように、指といっしょに撮る）

---

# マイコンって、どこにいるの？

:::

**マイコン**は「小さなコンピュータ」のこと。じつは身のまわりにたくさんいるよ。

- エアコン … 温度をはかって、風を調節する
- 電子レンジ … ボタンを見て、時間をはかる
- 自動ドア … 人が近づいたのを感じて、ドアを開ける
- ゲームのコントローラー … ボタンが押されたのを伝える

> どれも「**感じて → 考えて → 動かす**」をしているね。これがマイコンの仕事だよ。

:::

> 📷 身のまわりの家電のイラストや写真（エアコン・電子レンジ・自動ドアなど）

---

# パソコンとは、なにがちがうの？

:::

パソコンもコンピュータだけど、マイコンとはちょっとちがうんだ。

- **画面** … パソコンにはある。マイコンには**ない**
- **できること** … パソコンはなんでも。マイコンは**ひとつの仕事だけ**
- **電源を入れると** … パソコンはデスクトップが出る。マイコンは**すぐプログラムが動きだす**

> マイコンは「ひとつの仕事だけを、ずっとまじめにやり続ける」のが得意なんだ。

:::

> 📷 パソコンとUIAPduinoを並べた写真（大きさの差が伝わるように）

---

# Arduino ってなに？

:::

**Arduino（アルデュイーノ）** は、マイコンを**だれでも使えるようにしたしくみ**の名前だよ。

2つでワンセットになっている。

1. **ボード** … マイコンがのった小さな基板（きょう使うのがこれ）
2. **Arduino IDE** … プログラムを書いて、ボードに送りこむ道具

> 世界中の人が Arduino を使っているから、**作り方や作例がインターネットにたくさんある**。
> 困ったときに調べやすいのも、Arduino のいいところだよ。

:::

> 📷 Arduino IDE の画面（プログラムが書かれている全体像。細かい説明は次の章で）

---

# UIAPduino ってなに？

:::

きょう使うのが **UIAPduino（ユーアイエーピーデュイーノ）**。
日本の人が「**もっと安くマイコンを使えるように**」と考えて作ったボードだよ。

- **1枚 290円**（ジュース1本ぶんくらい！）
- 中に入っているマイコンは **CH32V003**
- 1秒間に **4800万回** 計算できる（48MHz）
- プログラムを入れられるのは **16KB**

> 16KB は、文字だと1万6千文字ぶん。作文用紙40枚くらい。
> 小さいけど、**LEDやモーターを動かすには十分**なんだ。

:::

> 📷 UIAPduino の表と裏の写真（2枚ならべる）

---

# 基板を見てみよう

:::

自分のボードを見ながら、名前をおぼえよう。

1. **USB Type-C** … パソコンとつなぐところ
2. **RESET ボタン** … 押すとプログラムが最初からやり直しになる
3. **青いLED** … 電気がきているしるし（自分では消せない）
4. **オレンジのLED** … **自分のプログラムで光らせられる**
5. **ピン（金色のあな）** … 部品をつなぐところ

> ⚠ 基板のうらには小さな部品がついているよ。**曲げたり、金属の上に置いたり**しないでね。

:::

> 📷 基板の写真に①〜⑤の番号と赤い囲みを入れたもの（Greenshotで注釈）

---

# ピンってなに？

:::

**ピン**は、外の部品とつなぐための「あな」だよ。ひとつずつ**名前**がついている。

- `D2` `D5` `D10` … デジタルのピン（**0か1**をやりとりする）
- `A0` `A1` `A2` … アナログも読めるピン（**とちゅうの値**が読める）
- `5V` `GND` … 電気を送る＋と−

プログラムでは、この名前を書いて「**どのピンを使うか**」を指定するんだ。

> ⚠ `D11` だけは、書き込みに使う大事な信号とかさなっているので**使わない**でね。

:::

> 📷 ピン配置図（基板の写真にピン名を書きこんだもの）※付録 x3_pinout と同じ画像を使う

---

# micro:bit とのちがい

:::

マイクロビットをさわったことがある人へ。

- **画面・ボタン** … micro:bit は最初からついている。UIAPduino は**ついていない**
- **センサー** … micro:bit は最初から入っている。UIAPduino は**自分でつなぐ**
- **プログラム** … micro:bit はブロックをならべる。UIAPduino は**文字で書く**

> 「何もついていない」って、ふべんに聞こえる？
> でも**自分でつなぐ**ということは、**つなぐものを自分で選べる**ということ。
> 作れるもののはばが、ぐんと広がるんだ。

:::

> 📷 micro:bit と UIAPduino を並べた写真

---

# これから作るもの

:::

このワークショップで、こんなことができるようになるよ。

1. LEDを**光らせる・点滅させる**
2. スイッチを押したら光る、つまみで**明るさを変える**
3. **くりかえし**や**もし〜なら**を使って、自動で動かす
4. **センサー**で明るさや距離を感じとる
5. **モーター**を回して、動く作品にする

> 💪 まずは次の章で、プログラムを作る道具をじゅんびしよう！

:::

> 📷 完成作品の写真（自動ライト、動くしっぽ など。第1回では「こんなのを作るよ」と見せるだけ）
