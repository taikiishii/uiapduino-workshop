# ③ もし〜なら（if / else）

じょうけんで動きを変える

*UIAPduino 体験ワークショップ*

---

# なにをするの？

:::

いままでのプログラムは、上から順に**そのとおり**動くだけだった。
こんどは**状況によって動きを変える**よ。

- `if` … もし〜なら
- `else` … そうでなければ
- くらべる記号（`<` `>` `==`）

> b2 のスイッチで、じつはもう使っていたね。ここでしっかりおぼえよう。

:::

> 📷 分かれ道のイメージ図

---

# if の形

:::

書き方はこうだよ。

- `else` の部分は、**いらなければ書かなくてOK**
- じょうけんは `( )` の中、やることは `{ }` の中

> 日本語にすると「**もし〜なら、こうする。そうでなければ、こうする**」。

:::
```cpp
if (じょうけん) {
  じょうけんが正しいときにやること
} else {
  そうでないときにやること
}
```
> 📷 if の各部分に色をつけて説明した図

---

# くらべる記号

:::

数をくらべるときは、この記号を使うよ。

- `a < b` … **小さい**
- `a > b` … **大きい**
- `a == b` … **同じ**
- `a != b` … **ちがう**

> ⚠ 「同じ」は `==`（2つ）。`=`（1つ）は**しまう**だったね。

:::

> 📷 記号の一覧表（大きく）

---

# しきい値って？

:::

つまみの値 **0〜1023** のどこかに**さかいめ**を決めるよ。

- 500より小さい → 光らせる
- 500以上 → 消す

この「さかいめの数」を **しきい値** というんだ。

> ちょうどいい数をさがすのも実験だよ。

:::

> 📷 数直線にしきい値を描いた図

---

# プログラムを書きこもう

:::

配線は b4 のまま（つまみが A2、LEDが5番）でOK。

1. 右のプログラムを書きこむ
2. つまみをゆっくり回す
3. あるところで**パッと**LEDが切りかわる

> b4 では明るさが**なめらかに**変わった。
> こんどは**パッと**切りかわる。これが `if` のはたらきだよ。

:::

```cpp しきい値で切りかえる
const int VR  = A2;
const int LED = 5;

void setup() {
  pinMode(LED, OUTPUT);
}

void loop() {
  int value = analogRead(VR);
  if (value < 500) {
    digitalWrite(LED, HIGH);   // 小さいとき
  } else {
    digitalWrite(LED, LOW);    // それ以外
  }
  delay(50);
}
```

---

# 3つ以上に分けたいとき

:::

`else if` をつなげると、3つ以上に分けられるよ。

> 上から順にしらべて、**最初に当てはまったところ**だけが実行される。

:::
```cpp
if (value < 300) {
  // とても小さい
} else if (value < 700) {
  // ちゅうくらい
} else {
  // 大きい
}
```
> 📷 3段階に分かれる流れ図

---

# 💪 やってみよう

しきい値と条件を変えてみよう。

1. `500` を `200` や `800` に変えると、切りかわる位置はどうなる？
2. `<` を `>` に変えると、どうなる？
3. `else if` を使って、**3段階の明るさ**に切りかえてみる

> 💪 ブザーと組み合わせて、しきい値をこえたら**音で知らせる**ようにしてみよう。

> 💪 これができれば、発展編の「**暗くなったら光る自動ライト**」まであと少し。
> つまみをセンサーに置きかえるだけなんだ。
